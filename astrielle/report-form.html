<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Astrielle AI Safety Report</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:#070912;color:#f7f3ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
    main{max-width:760px;margin:0 auto;padding:28px 18px 56px}
    .brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#b963ff;font-weight:800}
    h1{font-size:32px;margin:8px 0 8px}
    .sub{color:#a6a9be;margin:0 0 22px}
    .card{background:#0d1120;border:1px solid #2b3354;border-radius:20px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px;color:#d9c5ff}
    input,select,textarea{width:100%;border:1px solid #343d62;background:#12172a;color:#f7f3ff;border-radius:12px;padding:12px;font:inherit}
    textarea{min-height:140px;resize:vertical}
    select:focus,textarea:focus{outline:2px solid #8b5cf6;outline-offset:1px}
    button{margin-top:18px;width:100%;border:0;border-radius:13px;padding:14px 18px;font-weight:800;font-size:16px;color:white;background:linear-gradient(90deg,#6d42e8,#9b4dff,#e05acb)}
    small{display:block;color:#8f95ad;margin-top:12px}
    .hidden{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    a{color:#c99bff}
  </style>
</head>
<body>
<main>
  <div class="brand">ASTRIELLE AI · ECRIN LABS</div>
  <h1>Report a safety issue</h1>
  <p class="sub">Report unsafe, prohibited, or unexpected AI-generated content.</p>

  <div class="card">
    <form
      name="astrielle-safety-report"
      method="POST"
      action="/astrielle/report-success.html"
      data-netlify="true"
      netlify-honeypot="bot-field">

      <input type="hidden" name="form-name" value="astrielle-safety-report">
      <p class="hidden">
        <label>Do not fill this out if you are human:
          <input name="bot-field">
        </label>
      </p>

      <input type="hidden" name="reportId" value="manual-web-report">
      <input type="hidden" name="imageId" value="manual-web-report">
      <input type="hidden" name="edition" value="web">
      <input type="hidden" name="appVersion" value="web">
      <input type="hidden" name="timestamp" id="timestamp" value="">

      <label for="reason">Reason</label>
      <select id="reason" name="reason" required>
        <option value="">Choose a reason</option>
        <option value="Sexual or adult content">Sexual or adult content</option>
        <option value="Minor-related or exploitative content">Minor-related or exploitative content</option>
        <option value="Non-consensual or deepfake content">Non-consensual or deepfake content</option>
        <option value="Hateful or harassing content">Hateful or harassing content</option>
        <option value="Dangerous or harmful content">Dangerous or harmful content</option>
        <option value="Other safety issue">Other safety issue</option>
      </select>

      <label for="prompt">Prompt / details</label>
      <textarea id="prompt" name="prompt" maxlength="2000" placeholder="Describe what happened. Do not include passwords or other sensitive personal information." required></textarea>

      <button type="submit">Send safety report</button>
      <small>Reports are used for safety and abuse review. See the <a href="/astrielle/privacy.html">Privacy Policy</a>.</small>
    </form>
  </div>
</main>
<script>
  document.getElementById('timestamp').value = String(Date.now());
</script>
</body>
</html>
